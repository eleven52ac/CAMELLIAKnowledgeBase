name: Sync to Gitee

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror GitHub repo to Gitee
        env:
          GITEE_USER: Camelliaxiaohua
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config --global user.name "github-sync-bot"
          git config --global user.email "sync@github.com"

          git clone --bare https://github.com/${{ github.repository }} repo.git
          cd repo.git

          git push --mirror https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git
